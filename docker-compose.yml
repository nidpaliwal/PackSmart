services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/packsmart.db
      - ADMIN_TOKEN=${ADMIN_TOKEN:-packsmart-admin-change-me}
      - CORS_ORIGINS=http://localhost,http://localhost:80
    volumes:
      - db-data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db-data:
